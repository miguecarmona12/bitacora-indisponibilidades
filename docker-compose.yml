version: '3.0'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitacora
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - /opt/bitacora/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitacora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bitacora_network

  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      TZ: America/Bogota
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bitacora
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL:-gpt-3.5-turbo}
      FRONTEND_URL: https://bita.ux.local,http://localhost:5173
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@bitacora.local}
    volumes:
      - ./backend:/app
    networks:
      - bitacora_network
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
  

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://bita-backend.ux.local
    container_name: react_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      TZ: America/Bogota
      # Allow overriding at deploy time by setting the VITE_API_URL env var
      VITE_API_URL: ${VITE_API_URL:-https://bita-backend.ux.local}
    networks:
      - bitacora_network

networks:
  bitacora_network:
    driver: bridge